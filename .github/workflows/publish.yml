name: publish datasheet

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "test/**"
      - "site/**"
      - "deno.json"
      - ".github/workflows/publish.yml"
  schedule:
    # Bifrost and every provider catalog churn daily; refresh the published sheet.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck
        run: deno check src/cli.ts test/merge_test.ts

      - name: Test merge rules
        run: deno test -A test/

      - name: Build datasheet
        # Providers with an authenticated listing (sail) are skipped with a
        # warning when their secret is absent, so the sheet still publishes.
        env:
          SAIL_API_KEY: ${{ secrets.SAIL_API_KEY }}
        run: deno task datasheet --out-dir site --quiet

      - name: Job summary
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os
          merged = json.load(open("site/datasheet.json"))
          overlays = [json.load(open(p)) for p in sorted(glob.glob("site/*.json"))
                      if os.path.basename(p) != "datasheet.json"]
          print("### datasheet built\n")
          print(f"- merged datasheet: **{len(merged)}** entries "
                f"({len(merged) - sum(o['stats']['emitted'] for o in overlays)} stock)")
          print("\n| provider | models | extend a core | standalone | extends stock | unchanged | priced | units |")
          print("|---|---|---|---|---|---|---|---|")
          for o in overlays:
              s = o["stats"]
              print(f"| {o['provider']} | {s['models']} | {s['matched_cores']} | "
                    f"{s['unmatched_cores']} | {s.get('extends_stock', 0)} | {s.get('unchanged', 0)} | "
                    f"{s['with_prices']} | {o.get('units', 'USD')} |")
          print("\n| source | status | bytes | entries |")
          print("|---|---|---|---|")
          for o in overlays:
              for src in o.get("sources", []):
                  print(f"| {src['url']} | {src['status']} | {src['bytes']} | {src['entries']} |")
          PY
          du -h site/*.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
